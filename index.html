<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Koji's Word Play - Sony Music</title>
  <style>
    :root {
      --brand-color: #ff0055;        /* Neon Pink instead of Wordle Green */
      --color-correct: #ff0055;      /* Hit Spot */
      --color-present: #00e5ff;      /* Electric Cyan instead of Yellow */
      --color-absent: #2a2a2e;       /* Off Key */
      --color-border: #44444c;
      --color-tile-active: #ff0055;
      --color-bg: #0c0c0e;
    }

    * { box-sizing: border-box; font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif; }

    body {
      background-color: var(--color-bg);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      margin: 0;
      padding: 5px 10px 10px 10px;
      touch-action: manipulation;
      overflow: hidden;
      position: relative;
    }

    #bg-layer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: cover;
      background-position: center;
      filter: blur(4px) brightness(0.35);
      transform: scale(1.05);
      z-index: -1;
      transition: background-image 0.5s ease-in-out;
    }

    header {
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      width: 100%;
      max-width: 500px;
      padding: 4px 45px 6px 45px;
      position: relative;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.2rem, 4vw, 1.7rem);
      letter-spacing: 2px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--brand-color);
      transition: color 0.3s ease;
      text-shadow: 0 0 10px rgba(255,0,85,0.4);
      line-height: 1.1;
      word-break: break-word;
    }

    h2 {
      margin: 3px 0 0;
      font-size: clamp(0.7rem, 2.3vw, 0.85rem);
      color: #dddddd;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      line-height: 1.2;
      word-break: break-word;
    }

    #hidden-admin-trigger { position: absolute; top: 0; left: 0; width: 44px; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }
    #hidden-reset-trigger { position: absolute; top: 0; right: 0; width: 44px; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }

    #toast {
      position: fixed;
      top: 70px;
      background-color: var(--brand-color);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      z-index: 200;
      display: none;
      box-shadow: 0 0 15px rgba(255,0,85,0.5);
      animation: fadeIn 0.2s ease-in-out;
    }

    #board-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      width: 100%;
      max-height: 58vh;
    }

    #game-board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      grid-gap: 6px;
      padding: 4px;
      width: 100%;
      max-width: 340px;
      height: 100%;
      max-height: 390px;
    }

    .row { display: grid; grid-gap: 6px; }

    /* Music Capsule / Disc Tile Style */
    .tile {
      width: 100%;
      height: 100%;
      max-width: 58px;
      max-height: 58px;
      margin: 0 auto;
      border: 2px solid var(--color-border);
      border-radius: 12px; /* Distinct rounded corners */
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(1.3rem, 4.5vw, 1.8rem);
      font-weight: bold;
      text-transform: uppercase;
      user-select: none;
      background-color: rgba(20, 20, 24, 0.75);
      color: white;
      backdrop-filter: blur(4px);
      transition: border-color 0.2s, transform 0.1s;
    }

    .tile[data-state="active"] {
      border-color: var(--color-tile-active);
      box-shadow: 0 0 8px var(--color-tile-active);
      transform: scale(1.04);
    }

    .shake { animation: shake 0.5s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .pulse { animation: pulse 0.4s forwards; }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .tile[data-state="correct"] { background-color: var(--color-correct) !important; border-color: var(--color-correct) !important; color: #fff; }
    .tile[data-state="present"] { background-color: var(--color-present) !important; border-color: var(--color-present) !important; color: #000; }
    .tile[data-state="absent"] { background-color: var(--color-absent) !important; border-color: var(--color-absent) !important; color: #777; }

    #keyboard {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
      max-width: 500px;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .k-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      touch-action: manipulation;
    }

    .key {
      background-color: rgba(45, 45, 52, 0.85);
      color: white;
      border: 0;
      border-radius: 6px;
      height: clamp(42px, 6vh, 52px);
      flex: 1;
      font-weight: bold;
      font-size: clamp(0.85rem, 2.8vw, 1rem);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      backdrop-filter: blur(4px);
      -webkit-tap-highlight-color: transparent;
    }

    .key.wide { flex: 1.5; font-size: 0.75rem; }
    .key[data-state="correct"] { background-color: var(--color-correct); color: #fff; }
    .key[data-state="present"] { background-color: var(--color-present); color: #000; }
    .key[data-state="absent"] { background-color: var(--color-absent); opacity: 0.5; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.88);
      z-index: 100;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-content {
      background: #18181c;
      padding: 25px 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 0 30px rgba(255,0,85,0.25);
      border: 1px solid #333;
      text-align: center;
    }

    .modal-content h3 { margin-top: 0; font-size: 1.6rem; letter-spacing: 1px; color: var(--color-correct); }
    .modal-content p { color: #ccc; font-size: 0.95rem; margin: 10px 0 15px 0; }

    .result-word {
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: #ffffff;
      background: #25252b;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      display: inline-block;
      width: 100%;
      border: 1px solid var(--color-correct);
    }

    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 0.8rem; color: #aaa; }
    .form-group input[type="text"] {
      width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #444;
      background: #2a2a2a; color: white; font-size: 0.95rem; box-sizing: border-box;
    }

    .source-toggle { display: flex; gap: 10px; margin-bottom: 8px; }
    .toggle-btn {
      flex: 1; padding: 6px; font-size: 0.75rem; font-weight: bold; background: #2a2a2a;
      border: 1px solid #444; color: #aaa; border-radius: 4px; cursor: pointer; text-align: center;
    }
    .toggle-btn.active { background: var(--color-correct); color: #fff; border-color: var(--color-correct); }
    .file-picker-wrapper { display: flex; gap: 8px; align-items: center; }
    .file-picker-btn { background: #333; color: #fff; padding: 8px 12px; border-radius: 5px; font-size: 0.85rem; cursor: pointer; border: 1px solid #555; font-weight: bold; }
    .btn-clear-photo { background: #d32f2f; color: white; border: none; padding: 8px 10px; border-radius: 5px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
    .color-picker-wrapper { display: flex; align-items: center; gap: 12px; background: #2a2a2a; padding: 6px 12px; border-radius: 5px; border: 1px solid #444; }
    .color-picker-wrapper input[type="color"] { -webkit-appearance: none; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; background: none; }
    .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-wrapper input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
    .btn-save { background: var(--color-correct); color: white; }
    .btn-cancel { background: #444; color: white; }
  </style>
</head>
<body>

  <div id="bg-layer"></div>
  <div id="toast">Off Key</div>

  <header>
    <div id="hidden-admin-trigger" onclick="openAdmin()"></div>
    <div id="hidden-reset-trigger" onclick="resetGame()"></div>
    <h1 id="title">KOJI'S WORD PLAY</h1>
    <h2 id="subtitle">GUEST CHALLENGE</h2>
  </header>

  <div id="board-container">
    <div id="game-board"></div>
  </div>

  <div id="keyboard">
    <div class="k-row">
      <button class="key" data-key="Q">Q</button>
      <button class="key" data-key="W">W</button>
      <button class="key" data-key="E">E</button>
      <button class="key" data-key="R">R</button>
      <button class="key" data-key="T">T</button>
      <button class="key" data-key="Y">Y</button>
      <button class="key" data-key="U">U</button>
      <button class="key" data-key="I">I</button>
      <button class="key" data-key="O">O</button>
      <button class="key" data-key="P">P</button>
    </div>
    <div class="k-row">
      <button class="key" data-key="A">A</button>
      <button class="key" data-key="S">S</button>
      <button class="key" data-key="D">D</button>
      <button class="key" data-key="F">F</button>
      <button class="key" data-key="G">G</button>
      <button class="key" data-key="H">H</button>
      <button class="key" data-key="J">J</button>
      <button class="key" data-key="K">K</button>
      <button class="key" data-key="L">L</button>
    </div>
    <div class="k-row">
      <button class="key wide" data-key="ENTER">SUBMIT</button>
      <button class="key" data-key="Z">Z</button>
      <button class="key" data-key="X">X</button>
      <button class="key" data-key="C">C</button>
      <button class="key" data-key="V">V</button>
      <button class="key" data-key="B">B</button>
      <button class="key" data-key="N">N</button>
      <button class="key" data-key="M">M</button>
      <button class="key wide" data-key="BACK">DEL</button>
    </div>
  </div>

  <div id="result-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="result-title">HIT SINGLE!</h3>
      <p id="result-message">You nailed the track in 3 takes!</p>
      <div id="result-word-display" class="result-word">ALBUM</div>
      <div class="btn-group">
        <button class="btn btn-save" onclick="closeResult()">Close</button>
        <button class="btn btn-cancel" onclick="resetGame()">Next Take</button>
      </div>
    </div>
  </div>

  <div id="admin-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>Producer Panel</h3>
      <div class="form-group">
        <label>Guest / Band Name</label>
        <input type="text" id="admin-guest" placeholder="e.g. Bring Me The Horizon">
      </div>
      <div class="form-group">
        <label>Target Word (4, 5, or 6 Letters)</label>
        <input type="text" id="admin-word" placeholder="e.g. ALBUM" maxlength="6">
      </div>
      
      <div class="form-group">
        <label>Background Image Source</label>
        <div class="source-toggle">
          <div id="toggle-file-btn" class="toggle-btn active" onclick="setBgSourceMode('file')">Photo Library</div>
          <div id="toggle-url-btn" class="toggle-btn" onclick="setBgSourceMode('url')">Image URL</div>
        </div>

        <div id="bg-file-container" class="file-picker-wrapper">
          <label for="admin-bg-file" class="file-picker-btn">Choose Photo...</label>
          <input type="file" id="admin-bg-file" accept="image/*" style="display:none;" onchange="handleFileSelect(event)">
          <span id="bg-file-name" style="font-size: 0.8rem; color: #aaa; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">No photo loaded</span>
          <button class="btn-clear-photo" onclick="clearPhoto()">Clear</button>
        </div>

        <div id="bg-url-container" style="display: none;">
          <input type="text" id="admin-bg-url" placeholder="https://example.com/album-art.jpg">
        </div>
      </div>

      <div class="form-group">
        <label>Artist Brand Color</label>
        <div class="color-picker-wrapper">
          <input type="color" id="admin-color" value="#ff0055">
          <span id="admin-color-hex" style="font-size: 0.85rem; color: #ccc; font-weight: bold;">#FF0055</span>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-cancel" onclick="closeAdmin()">Cancel</button>
        <button class="btn btn-save" onclick="saveAdmin()">Save & Launch</button>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    
    let rawWordParam = urlParams.get('w');
    let targetWord = 'ALBUM';
    if (rawWordParam) {
      try {
        targetWord = atob(rawWordParam).trim().toUpperCase();
      } catch (e) {
        targetWord = 'ALBUM';
      }
    } else if (urlParams.get('word')) {
      targetWord = urlParams.get('word').trim().toUpperCase();
    }

    if (targetWord.length < 4 || targetWord.length > 6) {
      targetWord = 'ALBUM';
    }

    let guestName = urlParams.get('guest') || 'Special Guest';
    let brandColor = urlParams.get('color') ? `#${urlParams.get('color')}` : '#ff0055';
    let bgImage = urlParams.get('bg') || '';
    let bgSourceMode = 'file';

    let wordLength = targetWord.length;
    const maxAttempts = 6;
    let currentAttempt = 0;
    let currentGuess = '';
    let isGameOver = false;

    const validDictionary = new Set([
      "ABOUT","ABOVE","ABUSE","ACTOR","ACUTE","ADMIT","ADOPT","ADULT","AFTER","AGAIN","AGENT","AGREE","AHEAD","ALARM","ALBUM","ALERT","ALIEN","ALIKE","ALIVE","ALLOW","ALONE","ALONG","ALTER","ALWAYS","AMONG","ANGER","ANGLE","ANGRY","APART","APPLE","APPLY","ARENA","ARGUE","ARISE","ARRAY","ASIDE","ASSET","AUDIO","AUDIT","AVOID","AWARD","AWARE","BADLY","BAKER","BASES","BASIC","BASIS","BEACH","BEGAN","BEGIN","BEGUN","BEING","BELOW","BENCH","BILLY","BIRTH","BLACK","BLADE","BLAME","BLIND","BLOCK","BLOOD","BOARD","BOOST","BOOTH","BOUND","BRAIN","BRAND","BREAD","BREAK","BREED","BRIEF","BRING","BROAD","BROWN","BUILD","BUILT","BUYER","CABLE","CALIF","CARRY","CATCH","CAUSE","CHAIN","CHAIR","CHAOS","CHART","CHASE","CHEAP","CHECK","CHEST","CHIEF","CHILD","CHINA","CHOSE","CIVIL","CLAIM","CLASS","CLEAN","CLEAR","CLICK","CLOCK","CLOSE","COACH","COAST","COLOR","COUNT","COURT","COVER","CRAFT","CRASH","CREAM","CRIME","CROSS","CROWD","CROWN","CYCLE","DAILY","DANCE","DATED","DEALT","DEATH","DEBUG","DELAY","DEPTH","DIRTY","DISCO","DOUBT","DOZEN","DRAFT","DRAMA","DREAM","DRESS","DRILL","DRINK","DRIVE","DROVE","DYING","EAGER","EARLY","EARTH","EIGHT","ELITE","EMPTY","ENEMY","ENJOY","ENTER","ENTRY","EQUAL","ERROR","EVENT","EVERY","EXACT","EXIST","EXTRA","FAITH","FALSE","FAULT","FIBER","FIELD","FIFTH","FIFTY","FINAL","FIRST","FIXED","FLASH","FLEET","FLOOR","FLUID","FOCUS","FORCE","FORUM","FORTH","FORTY","FOUND","FRAME","FRANK","FRAUD","FRESH","FRONT","FRUIT","FULLY","FUNNY","GIANT","GIVEN","GLASS","GLOBE","GOING","GRACE","GRADE","GRAND","GRANT","GRASS","GREAT","GREEN","GROSS","GROUP","GROWN","GUARD","GUESS","GUEST","GUIDE","HAPPY","HORSE","HOTEL","HOUSE","HUMAN","IDEAL","IMAGE","INDEX","INNER","INPUT","ISSUE","JAPAN","JOINT","JUDGE","JUICE","KNIFE","LABOR","LARGE","LASER","LATER","LAUGH","LAYER","LEARN","LEASE","LEAST","LEAVE","LEGAL","LEVEL","LIGHT","LIMIT","LOCAL","LOGIC","LOOSE","LOWER","LUCKY","LUNCH","MAGIC","MAJOR","MAKER","MARCH","MATCH","MAYBE","MAYOR","MEDIA","METAL","MIGHT","MINOR","MINUS","MODEL","MONEY","MONTH","MOTOR","MOUNT","MOUSE","MOUTH","MOVIE","MUSIC","NEEDS","NEVER","NEWLY","NIGHT","NOISE","NORTH","NOTED","NOVEL","NURSE","OFFER","OFTEN","ORDER","OTHER","OUGHT","PAINT","PANEL","PAPER","PARTY","PARTZ","PARTS","PEACE","PETER","PHASE","PHONE","PHOTO","PIECE","PILOT","PITCH","PLACE","PLAIN","PLANE","PLANT","PLATE","POINT","POUND","POWER","PRESS","PRICE","PRIDE","PRIME","PRIZE","PROOF","PROUD","PROVE","QUEEN","QUICK","QUIET","QUITE","RADIO","RAISE","RANGE","RAPID","RATIO","REACH","READY","REFER","RIGHT","RIVAL","RIVER","ROBIN","ROGER","ROMAN","ROUGH","ROUND","ROUTE","ROYAL","RULED","SCALE","SCENE","SCOPE","SCORE","SENSE","SERVE","SEVEN","SHALL","SHARE","SHARP","SHEET","SHELF","SHELL","SHIFT","SHIRT","SHOOT","SHORT","SHOWN","SIGHT","SINCE","SIXTH","SIXTY","SIZED","SKILL","SLEEP","SLIDE","SMALL","SMART","SMILE","SMITH","SMOKE","SOLID","SOLVE","SORRY","SOUND","SOUTH","SPACE","SPARE","SPEAK","SPEED","SPEND","SPENT","SPLIT","SPOKE","SPORT","STAFF","STAGE","STAKE","STAND","START","STATE","STEAM","STEEL","STICK","STILL","STOCK","STONE","STOOD","STORE","STORY","STRIP","STUCK","STUDY","STUFF","STYLE","SUGAR","SUITE","SUPER","SWEET","TABLE","TAKEN","TASTE","TAXES","TEACH","TEETH","TEXAS","THANK","THEFT","THEIR","THEME","THERE","THESE","THICK","THING","THINK","THIRD","THOSE","THREE","THREW","THROW","TIGHT","TIMES","TITLE","TODAY","TOPIC","TOTAL","TOUCH","TOUGH","TOWER","TRACK","TRADE","TRAIN","TREAT","TREND","TRIAL","TRIED","TRIES","TRUCK","TRULY","TRUST","TRUTH","TWICE","UNDER","UNION","UNITY","UNTIL","UPPER","UPSET","URBAN","USAGE","USUAL","VALID","VALUE","VIDEO","VIRUS","VISIT","VITAL","VOICE","WASTE","WATCH","WATER","WHEEL","WHERE","WHICH","WHILE","WHITE","WHOLE","WHOSE","WOMAN","WOMEN","WORLD","WORRY","WORST","WORTH","WOULD","WOUND","WRITE","WRONG","WROTE","YIELD","YOUNG","YOUTH",
      "ACTION","ACTUAL","ADVICE","AGENCY","AGREED","ALMOST","ALWAYS","AMOUNT","ANIMAL","ANNUAL","ANSWER","ANYONE","ANYWAY","APPEAL","APPEAR","ARTIST","BAND","BASS","BEAT","CHORD","CLUB","DANCE","DEALS","DISC","DRUM","FOCUS","GENRE","GUITAR","JAZZ","KOJI","LIVE","MEDIA","MUSIC","PARTY","PIRATE","POP","RECORD","ROCK","ROSTER","SHOW","SINGLE","SONG","SONY","SOUL","STAGE","STAR","STUDIO","TALENT","TOUR","TOURING","TRACK","VARLEY","VINYL","VOCAL","YOUTHS"
    ]);

    function applyBrandColor(color) {
      document.documentElement.style.setProperty('--brand-color', color);
      document.documentElement.style.setProperty('--color-correct', color);
    }

    function applyBackgroundImage(url) {
      const bgLayer = document.getElementById('bg-layer');
      if (!url) {
        bgLayer.style.backgroundImage = 'none';
        return;
      }

      if (!url.startsWith('http') && !url.startsWith('data:')) {
        const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
        url = baseUrl + url;
      }

      bgLayer.style.backgroundImage = `url('${url}')`;
    }

    function setBgSourceMode(mode) {
      bgSourceMode = mode;
      const fileBtn = document.getElementById('toggle-file-btn');
      const urlBtn = document.getElementById('toggle-url-btn');
      const fileContainer = document.getElementById('bg-file-container');
      const urlContainer = document.getElementById('bg-url-container');

      if (mode === 'file') {
        fileBtn.classList.add('active');
        urlBtn.classList.remove('active');
        fileContainer.style.display = 'flex';
        urlContainer.style.display = 'none';
      } else {
        urlBtn.classList.add('active');
        fileBtn.classList.remove('active');
        urlContainer.style.display = 'block';
        fileContainer.style.display = 'none';
      }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          bgImage = e.target.result;
          document.getElementById('bg-file-name').innerText = file.name;
        };
        reader.readAsDataURL(file);
      }
    }

    function clearPhoto() {
      bgImage = '';
      document.getElementById('admin-bg-file').value = '';
      document.getElementById('admin-bg-url').value = '';
      document.getElementById('bg-file-name').innerText = 'No photo loaded';
    }

    function initGame() {
      wordLength = targetWord.length;
      currentAttempt = 0;
      currentGuess = '';
      isGameOver = false;

      validDictionary.add(targetWord);
      applyBrandColor(brandColor);
      applyBackgroundImage(bgImage);

      document.getElementById('subtitle').innerText = `KOJI VS. ${guestName}`;
      closeResult();

      const board = document.getElementById('game-board');
      board.innerHTML = '';

      for (let i = 0; i < maxAttempts; i++) {
        const row = document.createElement('div');
        row.className = 'row';
        row.id = `row-${i}`;
        row.style.gridTemplateColumns = `repeat(${wordLength}, 1fr)`;
        for (let j = 0; j < wordLength; j++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.id = `tile-${i}-${j}`;
          row.appendChild(tile);
        }
        board.appendChild(row);
      }

      document.querySelectorAll('.key').forEach(k => k.removeAttribute('data-state'));
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 1500);
    }

    function isValidWord(word) {
      if (word.length !== wordLength) return false;
      return validDictionary.has(word) || word === targetWord;
    }

    function handleKey(key) {
      if (isGameOver) return;

      if (key === 'BACK' || key === 'BACKSPACE') {
        if (currentGuess.length > 0) {
          currentGuess = currentGuess.slice(0, -1);
          const tile = document.getElementById(`tile-${currentAttempt}-${currentGuess.length}`);
          if (tile) {
            tile.innerText = '';
            tile.removeAttribute('data-state');
          }
        }
      } else if (key === 'ENTER') {
        if (currentGuess.length === wordLength) {
          if (isValidWord(currentGuess)) {
            checkGuess();
          } else {
            showToast("Off Key");
            shakeRow();
          }
        } else {
          showToast("Not enough letters");
          shakeRow();
        }
      } else if (currentGuess.length < wordLength && /^[A-Z]$/.test(key)) {
        const tile = document.getElementById(`tile-${currentAttempt}-${currentGuess.length}`);
        if (tile) {
          tile.innerText = key;
          tile.setAttribute('data-state', 'active');
          currentGuess += key;
        }
      }
    }

    function shakeRow() {
      const row = document.getElementById(`row-${currentAttempt}`);
      if (row) {
        row.classList.add('shake');
        setTimeout(() => row.classList.remove('shake'), 500);
      }
    }

    function checkGuess() {
      const row = document.getElementById(`row-${currentAttempt}`);
      const guessArr = currentGuess.split('');
      const targetArr = targetWord.split('');
      const tileStates = Array(wordLength).fill('absent');

      guessArr.forEach((char, i) => {
        if (char === targetArr[i]) {
          tileStates[i] = 'correct';
          targetArr[i] = null;
        }
      });

      guessArr.forEach((char, i) => {
        if (tileStates[i] !== 'correct' && targetArr.includes(char)) {
          tileStates[i] = 'present';
          targetArr[targetArr.indexOf(char)] = null;
        }
      });

      guessArr.forEach((char, i) => {
        const tile = document.getElementById(`tile-${currentAttempt}-${i}`);
        const key = document.querySelector(`.key[data-key="${char}"]`);

        if (tile) {
          setTimeout(() => {
            tile.classList.add('pulse');
            tile.setAttribute('data-state', tileStates[i]);

            if (key) {
              const currentState = key.getAttribute('data-state');
              if (tileStates[i] === 'correct') {
                key.setAttribute('data-state', 'correct');
              } else if (tileStates[i] === 'present' && currentState !== 'correct') {
                key.setAttribute('data-state', 'present');
              } else if (tileStates[i] === 'absent' && !currentState) {
                key.setAttribute('data-state', 'absent');
              }
            }
          }, i * 200);
        }
      });

      setTimeout(() => {
        if (currentGuess === targetWord) {
          isGameOver = true;
          showResult(true);
        } else {
          currentAttempt++;
          currentGuess = '';
          if (currentAttempt === maxAttempts) {
            isGameOver = true;
            showResult(false);
          }
        }
      }, wordLength * 200 + 300);
    }

    function showResult(isWin) {
      const modal = document.getElementById('result-modal');
      const title = document.getElementById('result-title');
      const msg = document.getElementById('result-message');
      const wordDisplay = document.getElementById('result-word-display');

      wordDisplay.innerText = targetWord;

      if (isWin) {
        title.innerText = "HIT SINGLE!";
        title.style.color = "var(--color-correct)";
        msg.innerText = `${guestName} nailed it in ${currentAttempt + 1}/${maxAttempts} takes!`;
      } else {
        title.innerText = "OUT OF TAKES!";
        title.style.color = "#e53935";
        msg.innerText = `${guestName} ran out of guesses!`;
      }

      modal.style.display = 'flex';
    }

    function closeResult() {
      document.getElementById('result-modal').style.display = 'none';
    }

    function resetGame() { initGame(); }

    function openAdmin() {
      document.getElementById('admin-guest').value = guestName;
      document.getElementById('admin-word').value = targetWord;
      document.getElementById('admin-color').value = brandColor;
      document.getElementById('admin-color-hex').innerText = brandColor.toUpperCase();
      document.getElementById('admin-modal').style.display = 'flex';
    }

    function closeAdmin() {
      document.getElementById('admin-modal').style.display = 'none';
    }

    function saveAdmin() {
      const g = document.getElementById('admin-guest').value.trim();
      const w = document.getElementById('admin-word').value.trim().toUpperCase();
      const c = document.getElementById('admin-color').value;

      if (w.length < 4 || w.length > 6) {
        alert('Please enter a 4, 5, or 6 letter word.');
        return;
      }

      if (bgSourceMode === 'url') {
        const urlVal = document.getElementById('admin-bg-url').value.trim();
        if (urlVal) bgImage = urlVal;
      }

      guestName = g || 'Special Guest';
      targetWord = w;
      brandColor = c;
      closeAdmin();
      initGame();
    }

    document.getElementById('admin-color').addEventListener('input', (e) => {
      document.getElementById('admin-color-hex').innerText = e.target.value.toUpperCase();
    });

    document.querySelectorAll('.key').forEach(k => {
      k.addEventListener('click', (e) => {
        handleKey(e.currentTarget.getAttribute('data-key'));
      });
    });

    document.addEventListener('keydown', (e) => {
      if (document.getElementById('admin-modal').style.display === 'flex') return;
      const key = e.key.toUpperCase();
      if (key === 'BACKSPACE' || key === 'ENTER' || /^[A-Z]$/.test(key)) {
        handleKey(key);
      }
    });

    initGame();
  </script>
</body>
</html>
