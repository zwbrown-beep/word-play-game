<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Word Play - Custom Challenge</title>
  <style>
    :root {
      --brand-color: #121213;
      --correct: #538d4e;
      --present: #b59f3b;
      --absent: #3a3a3c;
      --tile-border: #3a3a3c;
    }
    body {
      background-color: #121213;
      color: #ffffff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      margin: 0;
      padding: 20px 10px;
      box-sizing: border-box;
      touch-action: manipulation;
    }
    header {
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: var(--brand-color);
    }
    h2 {
      margin: 5px 0 0;
      font-size: 1.1rem;
      color: #818384;
      font-weight: 400;
    }
    #game-board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      grid-gap: 5px;
      width: 100%;
      max-width: 350px;
      aspect-ratio: 5 / 6;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-gap: 5px;
    }
    .tile {
      border: 2px solid var(--tile-border);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      text-transform: uppercase;
      user-select: none;
    }
    .tile[data-state="correct"] { background-color: var(--correct); border-color: var(--correct); }
    .tile[data-state="present"] { background-color: var(--present); border-color: var(--present); }
    .tile[data-state="absent"] { background-color: var(--absent); border-color: var(--absent); }
    
    #keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 500px;
    }
    .k-row {
      display: flex;
      justify-content: center;
      gap: 4px;
    }
    .key {
      background-color: #818384;
      color: white;
      border: 0;
      border-radius: 4px;
      height: 55px;
      flex: 1;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .key.wide { flex: 1.5; font-size: 0.8rem; }
  </style>
</head>
<body>

  <header>
    <h1 id="title">WORD PLAY</h1>
    <h2 id="subtitle">Koji vs. Guest</h2>
  </header>

  <div id="game-board"></div>

  <div id="keyboard">
    <div class="k-row">
      <button class="key" onclick="handleKey('Q')">Q</button>
      <button class="key" onclick="handleKey('W')">W</button>
      <button class="key" onclick="handleKey('E')">E</button>
      <button class="key" onclick="handleKey('R')">R</button>
      <button class="key" onclick="handleKey('T')">T</button>
      <button class="key" onclick="handleKey('Y')">Y</button>
      <button class="key" onclick="handleKey('U')">U</button>
      <button class="key" onclick="handleKey('I')">I</button>
      <button class="key" onclick="handleKey('O')">O</button>
      <button class="key" onclick="handleKey('P')">P</button>
    </div>
    <div class="k-row">
      <button class="key" onclick="handleKey('A')">A</button>
      <button class="key" onclick="handleKey('S')">S</button>
      <button class="key" onclick="handleKey('D')">D</button>
      <button class="key" onclick="handleKey('F')">F</button>
      <button class="key" onclick="handleKey('G')">G</button>
      <button class="key" onclick="handleKey('H')">H</button>
      <button class="key" onclick="handleKey('J')">J</button>
      <button class="key" onclick="handleKey('K')">K</button>
      <button class="key" onclick="handleKey('L')">L</button>
    </div>
    <div class="k-row">
      <button class="key wide" onclick="handleKey('ENTER')">ENTER</button>
      <button class="key" onclick="handleKey('Z')">Z</button>
      <button class="key" onclick="handleKey('X')">X</button>
      <button class="key" onclick="handleKey('C')">C</button>
      <button class="key" onclick="handleKey('V')">V</button>
      <button class="key" onclick="handleKey('B')">B</button>
      <button class="key" onclick="handleKey('N')">N</button>
      <button class="key" onclick="handleKey('M')">M</button>
      <button class="key wide" onclick="handleKey('BACK')">DEL</button>
    </div>
  </div>

  <script>
    // URL parameter support (e.g., index.html?word=MUSIC&guest=SonyArtist)
    const urlParams = new URLSearchParams(window.location.search);
    let targetWord = (urlParams.get('word') || 'KOJI').toUpperCase();
    let guestName = urlParams.get('guest') || 'Special Guest';
    let brandColor = urlParams.get('color') ? `#${urlParams.get('color')}` : '#e10600';

    document.getElementById('subtitle').innerText = `Special Challenge for ${guestName}`;
    document.documentElement.style.setProperty('--brand-color', brandColor);

    const wordLength = targetWord.length;
    const maxAttempts = 6;
    let currentAttempt = 0;
    let currentGuess = '';

    const board = document.getElementById('game-board');

    // Build Dynamic Board
    for (let i = 0; i < maxAttempts; i++) {
      const row = document.createElement('div');
      row.className = 'row';
      row.style.gridTemplateColumns = `repeat(${wordLength}, 1fr)`;
      for (let j = 0; j < wordLength; j++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.id = `tile-${i}-${j}`;
        row.appendChild(tile);
      }
      board.appendChild(row);
    }

    function handleKey(letter) {
      if (currentAttempt >= maxAttempts) return;

      if (letter === 'BACK') {
        currentGuess = currentGuess.slice(0, -1);
      } else if (letter === 'ENTER') {
        if (currentGuess.length === wordLength) {
          checkGuess();
        }
      } else if (currentGuess.length < wordLength && /^[A-Z]$/.i.test(letter)) {
        currentGuess += letter;
      }
      updateBoard();
    }

    function updateBoard() {
      for (let j = 0; j < wordLength; j++) {
        const tile = document.getElementById(`tile-${currentAttempt}-${j}`);
        tile.innerText = currentGuess[j] || '';
      }
    }

    function checkGuess() {
      const guessArray = currentGuess.split('');
      const targetArray = targetWord.split('');

      guessArray.forEach((char, index) => {
        const tile = document.getElementById(`tile-${currentAttempt}-${index}`);
        if (char === targetArray[index]) {
          tile.setAttribute('data-state', 'correct');
        } else if (targetArray.includes(char)) {
          tile.setAttribute('data-state', 'present');
        } else {
          tile.setAttribute('data-state', 'absent');
        }
      });

      if (currentGuess === targetWord) {
        setTimeout(() => alert('Challenge Complete!'), 300);
        currentAttempt = maxAttempts;
      } else {
        currentAttempt++;
        currentGuess = '';
        if (currentAttempt === maxAttempts) {
          setTimeout(() => alert(`Game Over! The word was: ${targetWord}`), 300);
        }
      }
    }

    // Onscreen/Physical Keyboard listener
    document.addEventListener('keydown', (e) => {
      const key = e.key.toUpperCase();
      if (key === 'BACKSPACE') handleKey('BACK');
      else if (key === 'ENTER') handleKey('ENTER');
      else if (/^[A-Z]$/.test(key)) handleKey(key);
    });
  </script>
</body>
</html>
