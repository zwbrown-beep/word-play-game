<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Koji's Word Play</title>
  <style>
    :root {
      --brand-color: #6aaa64;
      --color-correct: #6aaa64;
      --color-present: #c9b458;
      --color-absent: #3a3a3c;
      --color-border: #3a3a3c;
      --color-tile-active: #565758;
      --color-bg: #121213;
    }

    * { box-sizing: border-box; font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif; }

    body {
      background-color: var(--color-bg);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      margin: 0;
      padding: 5px 10px 10px 10px; /* Reduced bottom padding to protect keyboard fit */
      touch-action: manipulation;
      overflow: hidden;
      position: relative;
    }

    /* Softened Background Blur */
    #bg-layer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: cover;
      background-position: center;
      filter: blur(4px) brightness(0.4);
      transform: scale(1.05);
      z-index: -1;
      transition: background-image 0.5s ease-in-out;
    }

    /* Responsive Header Layout */
    header {
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      width: 100%;
      max-width: 500px;
      padding: 4px 45px 6px 45px;
      position: relative;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.2rem, 4vw, 1.7rem);
      letter-spacing: 2px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--brand-color);
      transition: color 0.3s ease;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      line-height: 1.1;
      word-break: break-word;
    }

    h2 {
      margin: 3px 0 0;
      font-size: clamp(0.7rem, 2.3vw, 0.85rem);
      color: #dddddd;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      line-height: 1.2;
      word-break: break-word;
    }

    /* Secret Hot-Zones */
    #hidden-admin-trigger {
      position: absolute;
      top: 0; left: 0;
      width: 44px; height: 100%;
      opacity: 0; cursor: pointer; z-index: 10;
    }

    #hidden-reset-trigger {
      position: absolute;
      top: 0; right: 0;
      width: 44px; height: 100%;
      opacity: 0; cursor: pointer; z-index: 10;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      top: 70px;
      background-color: #ffffff;
      color: #000000;
      padding: 8px 16px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.85rem;
      z-index: 200;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      animation: fadeIn 0.2s ease-in-out;
    }

    /* Game Board Container */
    #board-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      width: 100%;
      max-height: 58vh;
    }

    #game-board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      grid-gap: 4px;
      padding: 4px;
      width: 100%;
      max-width: 340px;
      height: 100%;
      max-height: 390px;
    }

    .row { display: grid; grid-gap: 4px; }

    .tile {
      width: 100%;
      height: 100%;
      max-width: 58px;
      max-height: 58px;
      margin: 0 auto;
      border: 2px solid var(--color-border);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(1.3rem, 4.5vw, 1.8rem);
      font-weight: bold;
      text-transform: uppercase;
      user-select: none;
      background-color: rgba(18, 18, 19, 0.65);
      color: white;
      backdrop-filter: blur(4px);
    }

    .tile[data-state="active"] {
      border-color: var(--color-tile-active);
      animation: pop 0.1s ease-in-out;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .shake { animation: shake 0.5s; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .flip { animation: flip 0.5s forwards; }

    @keyframes flip {
      0% { transform: rotateX(0deg); }
      50% { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); }
    }

    .tile[data-state="correct"] { background-color: var(--color-correct) !important; border-color: var(--color-correct) !important; }
    .tile[data-state="present"] { background-color: var(--color-present) !important; border-color: var(--color-present) !important; }
    .tile[data-state="absent"] { background-color: var(--color-absent) !important; border-color: var(--color-absent) !important; }

    /* Keyboard Layout Fixes */
    #keyboard {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
      max-width: 500px;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .k-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      touch-action: manipulation;
    }

    .key {
      background-color: rgba(129, 131, 132, 0.85);
      color: white;
      border: 0;
      border-radius: 4px;
      height: clamp(42px, 6vh, 52px); /* Tighter height range prevents overflow */
      flex: 1;
      font-weight: bold;
      font-size: clamp(0.85rem, 2.8vw, 1rem);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      backdrop-filter: blur(4px);
      -webkit-tap-highlight-color: transparent;
    }

    .key.wide { flex: 1.5; font-size: 0.75rem; }
    .key[data-state="correct"] { background-color: var(--color-correct); }
    .key[data-state="present"] { background-color: var(--color-present); }
    .key[data-state="absent"] { background-color: var(--color-absent); }

    /* Modals */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: #1e1e1e;
      padding: 25px 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 0 25px rgba(0,0,0,0.9);
      border: 1px solid #333;
      text-align: center;
    }

    .modal-content h3 { margin-top: 0; font-size: 1.6rem; letter-spacing: 1px; }
    .modal-content p { color: #ccc; font-size: 0.95rem; margin: 10px 0 15px 0; }

    .result-word {
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: var(--color-correct);
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      display: inline-block;
      width: 100%;
      transition: color 0.3s ease;
    }

    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 0.8rem; color: #aaa; }
    .form-group input[type="text"] {
      width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #444;
      background: #2a2a2a; color: white; font-size: 0.95rem; box-sizing: border-box;
    }

    /* Dual Mode Source Toggles */
    .source-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    .toggle-btn {
      flex: 1;
      padding: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #aaa;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }

    .toggle-btn.active {
      background: var(--color-correct);
      color: #fff;
      border-color: var(--color-correct);
    }

    .file-picker-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .file-picker-btn {
      background: #333;
      color: #fff;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid #555;
      font-weight: bold;
    }

    .file-picker-btn:active { background: #555; }

    .btn-clear-photo {
      background: #d32f2f;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 5px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: bold;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #2a2a2a;
      padding: 6px 12px;
      border-radius: 5px;
      border: 1px solid #444;
    }

    .color-picker-wrapper input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-wrapper input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
    .btn-save { background: var(--color-correct); color: white; transition: background 0.3s ease; }
    .btn-cancel { background: #444; color: white; }
  </style>
</head>
<body>

  <div id="bg-layer"></div>
  <div id="toast">Not in word list</div>

  <header>
    <div id="hidden-admin-trigger" onclick="openAdmin()"></div>
    <div id="hidden-reset-trigger" onclick="resetGame()"></div>
    <h1 id="title">KOJI'S WORD PLAY</h1>
    <h2 id="subtitle">GUEST CHALLENGE</h2>
  </header>

  <div id="board-container">
    <div id="game-board"></div>
  </div>

  <div id="keyboard">
    <div class="k-row">
      <button class="key" data-key="Q">Q</button>
      <button class="key" data-key="W">W</button>
      <button class="key" data-key="E">E</button>
      <button class="key" data-key="R">R</button>
      <button class="key" data-key="T">T</button>
      <button class="key" data-key="Y">Y</button>
      <button class="key" data-key="U">U</button>
      <button class="key" data-key="I">I</button>
      <button class="key" data-key="O">O</button>
      <button class="key" data-key="P">P</button>
    </div>
    <div class="k-row">
      <button class="key" data-key="A">A</button>
      <button class="key" data-key="S">S</button>
      <button class="key" data-key="D">D</button>
      <button class="key" data-key="F">F</button>
      <button class="key" data-key="G">G</button>
      <button class="key" data-key="H">H</button>
      <button class="key" data-key="J">J</button>
      <button class="key" data-key="K">K</button>
      <button class="key" data-key="L">L</button>
    </div>
    <div class="k-row">
      <button class="key wide" data-key="ENTER">ENTER</button>
      <button class="key" data-key="Z">Z</button>
      <button class="key" data-key="X">X</button>
      <button class="key" data-key="C">C</button>
      <button class="key" data-key="V">V</button>
      <button class="key" data-key="B">B</button>
      <button class="key" data-key="N">N</button>
      <button class="key" data-key="M">M</button>
      <button class="key wide" data-key="BACK">DEL</button>
    </div>
  </div>

  <!-- End Game Result Modal -->
  <div id="result-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="result-title">VICTORY!</h3>
      <p id="result-message">You solved the word in 3 tries!</p>
      <div id="result-word-display" class="result-word">ALBUM</div>
      <div class="btn-group">
        <button class="btn btn-save" onclick="closeResult()">Close</button>
        <button class="btn btn-cancel" onclick="resetGame()">Play Again</button>
      </div>
    </div>
  </div>

  <!-- Admin Panel Modal -->
  <div id="admin-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>Producer Panel</h3>
      <div class="form-group">
        <label>Guest / Band Name</label>
        <input type="text" id="admin-guest" placeholder="e.g. Bring Me The Horizon">
      </div>
      <div class="form-group">
        <label>Target Word (4, 5, or 6 Letters)</label>
        <input type="text" id="admin-word" placeholder="e.g. ALBUM" maxlength="6">
      </div>
      
      <div class="form-group">
        <label>Background Image Source</label>
        <div class="source-toggle">
          <div id="toggle-file-btn" class="toggle-btn active" onclick="setBgSourceMode('file')">Photo Library</div>
          <div id="toggle-url-btn" class="toggle-btn" onclick="setBgSourceMode('url')">Image URL</div>
        </div>

        <!-- Mode A: Local File Upload -->
        <div id="bg-file-container" class="file-picker-wrapper">
          <label for="admin-bg-file" class="file-picker-btn">Choose Photo...</label>
          <input type="file" id="admin-bg-file" accept="image/*" style="display:none;" onchange="handleFileSelect(event)">
          <span id="bg-file-name" style="font-size: 0.8rem; color: #aaa; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">No photo loaded</span>
          <button class="btn-clear-photo" onclick="clearPhoto()">Clear</button>
        </div>

        <!-- Mode B: URL Input -->
        <div id="bg-url-container" style="display: none;">
          <input type="text" id="admin-bg-url" placeholder="https://example.com/album-art.jpg">
        </div>
      </div>

      <div class="form-group">
        <label>Artist Brand Color</label>
        <div class="color-picker-wrapper">
          <input type="color" id="admin-color" value="#6aaa64">
          <span id="admin-color-hex" style="font-size: 0.85rem; color: #ccc; font-weight: bold;">#6AAA64</span>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-cancel" onclick="closeAdmin()">Cancel</button>
        <button class="btn btn-save" onclick="saveAdmin()">Save & Launch</button>
      </div>
    </div>
  </div>

  <textarea id="dict-checker" spellcheck="true" style="position:absolute; top:-9999px; left:-9999px;"></textarea>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let targetWord = (urlParams.get('word') || 'ALBUM').toUpperCase();
    let guestName = urlParams.get('guest') || 'Special Guest';
    let brandColor = urlParams.get('color') ? `#${urlParams.get('color')}` : '#6aaa64';
    let bgImage = urlParams.get('bg') || '';
    let bgSourceMode = 'file';

    let wordLength = targetWord.length;
    const maxAttempts = 6;
    let currentAttempt = 0;
    let currentGuess = '';
    let isGameOver = false;

    const customValidWords = new Set([
      'ALBUM', 'VINYL', 'AUDIO', 'STAGE', 'TRACK', 'VOCAL', 'CHORD', 'GENRE', 'MUSIC',
      'SINGLE', 'ARTIST', 'GUITAR', 'RECORD', 'STUDIO', 'TOURING', 'KOJI', 'SONY'
    ]);

    function applyBrandColor(color) {
      document.documentElement.style.setProperty('--brand-color', color);
      document.documentElement.style.setProperty('--color-correct', color);
    }

    function applyBackgroundImage(url) {
      const bgLayer = document.getElementById('bg-layer');
      if (url) {
        bgLayer.style.backgroundImage = `url('${url}')`;
      } else {
        bgLayer.style.backgroundImage = 'none';
      }
    }

    function setBgSourceMode(mode) {
      bgSourceMode = mode;
      const fileBtn = document.getElementById('toggle-file-btn');
      const urlBtn = document.getElementById('toggle-url-btn');
      const fileContainer = document.getElementById('bg-file-container');
      const urlContainer = document.getElementById('bg-url-container');

      if (mode === 'file') {
        fileBtn.classList.add('active');
        urlBtn.classList.remove('active');
        fileContainer.style.display = 'flex';
        urlContainer.style.display = 'none';
      } else {
        urlBtn.classList.add('active');
        fileBtn.classList.remove('active');
        urlContainer.style.display = 'block';
        fileContainer.style.display = 'none';
      }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          bgImage = e.target.result;
          document.getElementById('bg-file-name').innerText = file.name;
        };
        reader.readAsDataURL(file);
      }
    }

    function clearPhoto() {
      bgImage = '';
      document.getElementById('admin-bg-file').value = '';
      document.getElementById('admin-bg-url').value = '';
      document.getElementById('bg-file-name').innerText = 'No photo loaded';
    }

    function initGame() {
      wordLength = targetWord.length;
      currentAttempt = 0;
      currentGuess = '';
      isGameOver = false;

      customValidWords.add(targetWord);
      applyBrandColor(brandColor);
      applyBackgroundImage(bgImage);

      document.getElementById('subtitle').innerText = `KOJI VS. ${guestName}`;
      closeResult();

      const board = document.getElementById('game-board');
      board.innerHTML = '';

      for (let i = 0; i < maxAttempts; i++) {
        const row = document.createElement('div');
        row.className = 'row';
        row.id = `row-${i}`;
        row.style.gridTemplateColumns = `repeat(${wordLength}, 1fr)`;
        for (let j = 0; j < wordLength; j++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.id = `tile-${i}-${j}`;
          row.appendChild(tile);
        }
        board.appendChild(row);
      }

      document.querySelectorAll('.key').forEach(k => k.removeAttribute('data-state'));
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 1500);
    }

    async function isValidWord(word) {
      if (customValidWords.has(word)) return true;
      try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word.toLowerCase()}`);
        if (response.ok) return true;
      } catch (e) {}

      const hasVowel = /[AEIOUY]/i.test(word);
      return hasVowel;
    }

    async function handleKey(key) {
      if (isGameOver) return;

      if (key === 'BACK' || key === 'BACKSPACE') {
        if (currentGuess.length > 0) {
          currentGuess = currentGuess.slice(0, -1);
          const tile = document.getElementById(`tile-${currentAttempt}-${currentGuess.length}`);
          tile.innerText = '';
          tile.removeAttribute('data-state');
        }
      } else if (key === 'ENTER') {
        if (currentGuess.length === wordLength) {
          const valid = await isValidWord(currentGuess);
          if (valid) {
            checkGuess();
          } else {
            showToast("Not in word list");
            shakeRow();
          }
        } else {
          showToast("Not enough letters");
          shakeRow();
        }
      } else if (currentGuess.length < wordLength && /^[A-Z]$/.test(key)) {
        const tile = document.getElementById(`tile-${currentAttempt}-${currentGuess.length}`);
        tile.innerText = key;
        tile.setAttribute('data-state', 'active');
        currentGuess += key;
      }
    }

    function shakeRow() {
      const row = document.getElementById(`row-${currentAttempt}`);
      row.classList.add('shake');
      setTimeout(() => row.classList.remove('shake'), 500);
    }

    function checkGuess() {
      const row = document.getElementById(`row-${currentAttempt}`);
      const guessArr = currentGuess.split('');
      const targetArr = targetWord.split('');
      const tileStates = Array(wordLength).fill('absent');

      guessArr.forEach((char, i) => {
        if (char === targetArr[i]) {
          tileStates[i] = 'correct';
          targetArr[i] = null;
        }
      });

      guessArr.forEach((char, i) => {
        if (tileStates[i] !== 'correct' && targetArr.includes(char)) {
          tileStates[i] = 'present';
          targetArr[targetArr.indexOf(char)] = null;
        }
      });

      guessArr.forEach((char, i) => {
        const tile = document.getElementById(`tile-${currentAttempt}-${i}`);
        const key = document.querySelector(`.key[data-key="${char}"]`);

        setTimeout(() => {
          tile.classList.add('flip');
          tile.setAttribute('data-state', tileStates[i]);

          if (key) {
            const currentState = key.getAttribute('data-state');
            if (tileStates[i] === 'correct') {
              key.setAttribute('data-state', 'correct');
            } else if (tileStates[i] === 'present' && currentState !== 'correct') {
              key.setAttribute('data-state', 'present');
            } else if (tileStates[i] === 'absent' && !currentState) {
              key.setAttribute('data-state', 'absent');
            }
          }
        }, i * 250);
      });

      setTimeout(() => {
        if (currentGuess === targetWord) {
          isGameOver = true;
          showResult(true);
        } else {
          currentAttempt++;
          currentGuess = '';
          if (currentAttempt === maxAttempts) {
            isGameOver = true;
            showResult(false);
          }
        }
      }, wordLength * 250 + 300);
    }

    function showResult(isWin) {
      const modal = document.getElementById('result-modal');
      const title = document.getElementById('result-title');
      const msg = document.getElementById('result-message');
      const wordDisplay = document.getElementById('result-word-display');

      wordDisplay.innerText = targetWord;

      if (isWin) {
        title.innerText = "CHALLENGE PASSED!";
        title.style.color = "var(--color-correct)";
        msg.innerText = `${guestName} guessed it in ${currentAttempt + 1}/${maxAttempts} attempts!`;
      } else {
        title.innerText = "GAME OVER!";
        title.style.color = "#e53935";
        msg.innerText = `${guestName} ran out of guesses!`;
      }

      modal.style.display = 'flex';
    }

    function closeResult() {
      document.getElementById('result-modal').style.display = 'none';
    }

    function resetGame() { initGame(); }

    function openAdmin() {
      document.getElementById('admin-guest').value = guestName;
      document.getElementById('admin-word').value = targetWord;
      document.getElementById('admin-color').value = brandColor;
      document.getElementById('admin-color-hex').innerText = brandColor.toUpperCase();
      document.getElementById('admin-modal').style.display = 'flex';
    }

    function closeAdmin() {
      document.getElementById('admin-modal').style.display = 'none';
    }

    function saveAdmin() {
      const g = document.getElementById('admin-guest').value.trim();
      const w = document.getElementById('admin-word').value.trim().toUpperCase();
      const c = document.getElementById('admin-color').value;

      if (w.length < 4 || w.length > 6) {
        alert('Please enter a 4, 5, or 6 letter word.');
        return;
      }

      if (bgSourceMode === 'url') {
        const urlVal = document.getElementById('admin-bg-url').value.trim();
        if (urlVal) bgImage = urlVal;
      }

      guestName = g || 'Special Guest';
      targetWord = w;
      brandColor = c;
      closeAdmin();
      initGame();
    }

    document.getElementById('admin-color').addEventListener('input', (e) => {
      document.getElementById('admin-color-hex').innerText = e.target.value.toUpperCase();
    });

    document.querySelectorAll('.key').forEach(k => {
      k.addEventListener('click', (e) => {
        handleKey(e.currentTarget.getAttribute('data-key'));
      });
    });

    document.addEventListener('keydown', (e) => {
      if (document.getElementById('admin-modal').style.display === 'flex') return;
      const key = e.key.toUpperCase();
      if (key === 'BACKSPACE' || key === 'ENTER' || /^[A-Z]$/.test(key)) {
        handleKey(key);
      }
    });

    initGame();
  </script>
</body>
</html>
